# pyproject.toml
[project]
name = "aptitude"
version = "0.1.0"
description = "Generate reusable AI skills from PDFs, EPUBs, web pages, and GitHub repos using pluggable LLM providers."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "VikrantKurada" }]
keywords = ["ai", "llm", "skills", "claude", "cli", "pdf", "epub", "github", "mcp", "ollama"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Text Processing :: General",
]
dependencies = ["typer>=0.12", "httpx>=0.27", "pypdf>=4.2",
                "ebooklib>=0.18", "beautifulsoup4>=4.12", "tomli-w>=1.0"]

[project.optional-dependencies]
claude = ["anthropic>=0.34"]
gemini = ["google-genai>=0.3"]
all = ["anthropic>=0.34", "google-genai>=0.3"]
dev = ["pytest>=8.0"]

[project.scripts]
aptitude = "aptitude.cli:app"

[project.urls]
Homepage = "https://github.com/VikrantKurada/Aptitude"
Repository = "https://github.com/VikrantKurada/Aptitude"
Issues = "https://github.com/VikrantKurada/Aptitude/issues"

[tool.setuptools.packages.find]
include = ["aptitude*"]

[tool.pytest.ini_options]
markers = ["live: hits real provider APIs (deselected by default)"]
addopts = "-m 'not live'"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"
